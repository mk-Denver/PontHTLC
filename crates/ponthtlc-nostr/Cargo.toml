[package]
name = "ponthtlc-nostr"
version = "0.1.0"
edition = "2021"

[dependencies]
ponthtlc-protocol = { path = "../ponthtlc-protocol" }
bitcoin = "0.32"
secp256k1 = { version = "0.29", features = ["rand"] }
rand = "0.8"
aes = "0.8"
cbc = "0.1"
base64 = "0.22"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "rt", "sync", "net", "time"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"