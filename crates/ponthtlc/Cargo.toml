[package]
name = "ponthtlc"
version = "0.1.0"
edition = "2021"

[dependencies]
lightning = "0.2.0"
lightning-background-processor = "0.2.3"
lightning-liquidity = { version = "0.2.0", features = ["time"] }
lightning-rapid-gossip-sync = "0.2.0"
lightning-invoice = { version = "0.34.0", features = ["std"] }
lightning-net-tokio = "0.2.0"
lightning-persister = "0.2.0"
lightning-block-sync = { version = "0.2.0", features = ["rpc-client", "tokio"] }
bitcoin = "0.32"
rand = "0.8"
tokio = { version = "1", features = ["io-util", "macros", "rt", "rt-multi-thread", "sync", "net", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
hex = "0.4"
axum = { version = "0.7", features = ["ws"] }
ponthtlc-escrow = { path = "../ponthtlc-escrow" }
ponthtlc-nostr = { path = "../ponthtlc-nostr" }
ponthtlc-protocol = { path = "../ponthtlc-protocol" }

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }
http-body-util = "0.1"
