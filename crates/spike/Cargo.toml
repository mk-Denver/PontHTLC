[package]
name = "ponthtlc-spike"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "spike"
path = "src/main.rs"

[lib]
name = "ponthtlc_spike"
path = "src/lib.rs"

[dependencies]
lightning = "0.2.0"
lightning-invoice = { version = "0.34.0", features = ["std"] }
lightning-net-tokio = "0.2.0"
bitcoin = "0.32"
rand = "0.8"
tokio = { version = "1", features = ["io-util", "macros", "rt", "rt-multi-thread", "sync", "net", "time"] }
ponthtlc = { path = "../ponthtlc" }
