services:
  bitcoind:
    image: bitcoin/bitcoin:29
    command: >-
      -regtest
      -rpcbind=0.0.0.0
      -rpcallowip=0.0.0.0/0
      -rpcport=18923
      -rpcuser=ponthtlc
      -rpcpassword=ponthtlc
      -printtoconsole=0
    environment:
      BITCOIN_DATA: /home/bitcoin/.bitcoin
    ports:
      - "18923:18923"
    volumes:
      - bitcoind-data:/home/bitcoin/.bitcoin
    healthcheck:
      test: ["CMD", "bitcoin-cli", "-regtest", "-rpcport=18923", "-rpcuser=ponthtlc", "-rpcpassword=ponthtlc", "getblockchaininfo"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  nostr-relay:
    image: dockurr/strfry
    ports:
      - "7777:7777"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo >/dev/tcp/127.0.0.1/7777'"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  ponthtlc:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      bitcoind:
        condition: service_healthy
    ports:
      - "9800:9800"
    volumes:
      - ponthtlc-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9800/health/live"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      PONTHTLC_API: http://ponthtlc:9800
    depends_on:
      ponthtlc:
        condition: service_healthy
    ports:
      - "5173:5173"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  bitcoind-data:
  ponthtlc-data:
